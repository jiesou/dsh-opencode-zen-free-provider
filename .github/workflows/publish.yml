name: Publish to npm

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing / OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Without the install, tsc cannot see `@types/node` and fails with TS2688,
      # so the build step never regenerates lib/ and the committed one ships
      # instead. That only looked harmless because lib/ is committed and was
      # current; a src/ change without a local build would go out stale.
      # `npm install`, not `npm ci`: the lockfile is gitignored on purpose.
      - run: npm install --no-audit --no-fund

      - name: Typecheck, build and publish
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck --if-present && npm run build --if-present
          version="$(node -p "require('./package.json').version")"
          # A publish that exits 0 is not proof the version is live: when the
          # registry holds it back for proof-of-presence it still stores the
          # tarball (and its provenance attestation) and answers 200, so the CLI
          # prints "+ name@version" and reports success. 0.1.28 sat that way,
          # announced as published. Ask the registry instead of the CLI.
          visible() {
            npm view "@jiesou/dsh-opencode-zen-free-provider@${version}" version >/dev/null 2>&1
          }
          if output="$(npm publish --provenance --access public 2>&1)"; then
            echo "$output"
            for attempt in 1 2 3 4; do
              visible && break
              sleep 5
            done
            if visible; then
              echo "published ${version}"
            else
              echo "::warning::@jiesou/dsh-opencode-zen-free-provider@${version} was accepted but is not on the registry — it is staged pending 2FA approval. Run \`npm stage list\` and \`npm stage approve <stage-id>\`."
            fi
          elif grep -Eq 'EPUBLISHCONFLICT|previously published versions|previously staged version' <<<"$output"; then
            echo "skip: version ${version} is already published or staged"
          else
            echo "publish failed:"
            echo "$output"
            exit 1
          fi
