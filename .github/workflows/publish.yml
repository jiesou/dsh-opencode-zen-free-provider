name: Publish to npm

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing / OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Without the install, tsc cannot see `@types/node` and fails with TS2688,
      # so the build step never regenerates lib/ and the committed one ships
      # instead. That only looked harmless because lib/ is committed and was
      # current; a src/ change without a local build would go out stale.
      # `npm install`, not `npm ci`: the lockfile is gitignored on purpose.
      - run: npm install --no-audit --no-fund

      - name: Typecheck, build and publish
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck --if-present && npm run build --if-present
          version="$(node -p "require('./package.json').version")"
          if output="$(npm publish --provenance --access public 2>&1)"; then
            echo "$output"
            # npm 11 stages the upload instead of publishing it when the account
            # requires proof-of-presence and the run authenticates with a
            # trusted publisher: the command exits 0 while the registry stays
            # untouched until the owner approves the staged version. Reporting
            # that as "published" hid a release for a day (0.1.28).
            if grep -q 'has been staged' <<<"$output"; then
              echo "::warning::@jiesou/dsh-opencode-zen-free-provider@${version} was staged, not published — approve it with \`npm stage approve <stage-id>\`"
            else
              echo "published"
            fi
          elif grep -Eq 'EPUBLISHCONFLICT|previously published versions|previously staged version' <<<"$output"; then
            echo "skip: version ${version} is already published or staged"
          else
            echo "publish failed:"
            echo "$output"
            exit 1
          fi
